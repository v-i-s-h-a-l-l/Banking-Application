services:
  # ============================================================
  # Banking Platform Web Backend (Render Web Service)
  # ============================================================
  - type: web
    name: banking-api-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: banking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_SECRET
        generateValue: true

databases:
  # ============================================================
  # PostgreSQL Database Instance
  # ============================================================
  - name: banking-db
    databaseName: banking_platform
    user: banking
    plan: free
    region: oregon
